name: Release Artifact

# Publishes the `chronary` Python package to PyPI and creates a GitHub Release.
#
# Provenance posture:
#   - Publishes via PyPI Trusted Publishing — no PYPI_API_TOKEN required.
#     The `id-token: write` permission and `pypa/gh-action-pypi-publish`
#     are sufficient once chronary-python is registered as a Trusted
#     Publisher for the `chronary` project on pypi.org.
#   - `attestations: true` on the pypa publish action records a Sigstore
#     attestation that PyPI surfaces on the project page.
#   - GitHub artifact attestations also fire on public repos via
#     actions/attest-build-provenance (visibility-gated).
#
# Prerequisites (one-time, on flip to public):
#   1. chronary-python is public on GitHub.
#   2. pypi.org → Your projects → `chronary` → Publishing → Add a new
#      pending publisher (or, if the project exists, "Add a new publisher"):
#        Owner: Chronary
#        Repo: chronary-python
#        Workflow: release-artifact.yml
#        Environment: (leave blank)
#   3. PYPI_API_TOKEN repo secret has been deleted (if it was ever set)
#      and the legacy API token revoked on pypi.org.

on:
  push:
    tags:
      - 'v*'

# Least privilege (#1599): read-only by default; the release job raises
# only the scopes its steps use.
permissions:
  contents: read

jobs:
  release:
    # contents: write for `gh release create`; id-token + attestations for
    # OIDC registry publishing and actions/attest-build-provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing pushes with the checkout token, so keep it out of
          # .git/config, where install and test scripts could read it (#1659).
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate release manifest
        id: manifest
        run: |
          python - <<'PY'
          import json
          import os
          manifest = json.load(open(".chronary-release.json", "r", encoding="utf-8"))
          if manifest["artifact"] != "python-sdk":
              raise SystemExit("Expected artifact python-sdk")
          if manifest["public_tag"] != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("Tag mismatch between manifest and workflow ref")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"publish_registry={str(bool(manifest['publish_registry'])).lower()}\n"
              )
          PY
          test -f RELEASE_NOTES.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Test
        # Threshold is temporarily 88 to match .github/public-artifacts.json
        # (see PR #696 / issue #695). Restore to 90 once #695 lands the
        # missing tests for waitlist / audit_log / async webhook variants.
        run: python -m pytest -v --cov=chronary --cov-fail-under=88

      - name: Build
        run: python -m build

      # SBOM (EU CRA Annex I Part II (1), #1634): CycloneDX, attached to the
      # GitHub Release. Fail-closed: these run before anything is published,
      # with no continue-on-error, so no release ships without a valid SBOM.
      # Tool pins and the validator live in scripts/public-release/sbom.mjs.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          # Install the built wheel alone into a clean venv (the runtime
          # dependencies a user gets from PyPI), then describe that venv.
          # Written outside dist/, which the PyPI upload reads.
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/python" -m pip install --quiet "cyclonedx-bom==7.5.0"
          python -m venv "$RUNNER_TEMP/sbom-target"
          wheel="$(ls dist/*.whl)"
          "$RUNNER_TEMP/sbom-target/bin/python" -m pip install --quiet "$wheel"
          "$RUNNER_TEMP/sbom-target/bin/python" -m pip uninstall --quiet --yes pip
          mkdir -p sbom
          SBOM_FILE="sbom/chronary-python-${GITHUB_REF_NAME#v}.cdx.json"
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment \
            --pyproject pyproject.toml --mc-type library --sv 1.6 \
            --output-reproducible --of JSON -o "$SBOM_FILE" \
            "$RUNNER_TEMP/sbom-target/bin/python"
          echo "SBOM_FILE=$SBOM_FILE" >> "$GITHUB_ENV"

      - name: Validate SBOM
        env:
          EXPECTED_NAME: 'chronary'
        run: |
          node - "$SBOM_FILE" "$EXPECTED_NAME" "${GITHUB_REF_NAME#v}" <<'JS'
          const fs = require('fs');
          const [file, expectedName, expectedVersion] = process.argv.slice(2);
          const fail = (msg) => {
            console.error('::error::SBOM ' + file + ': ' + msg);
            process.exit(1);
          };
          let bom;
          try {
            bom = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (e) {
            fail('not readable JSON (' + e.message + ')');
          }
          if (bom.bomFormat !== 'CycloneDX') fail('bomFormat is ' + JSON.stringify(bom.bomFormat) + ', expected CycloneDX');
          if (!/^1\.[4-9]$/.test(String(bom.specVersion))) fail('unsupported specVersion ' + JSON.stringify(bom.specVersion));
          const main = bom.metadata && bom.metadata.component;
          if (!main) fail('metadata.component is missing');
          const name = [main.group, main.name].filter(Boolean).join('/');
          if (name !== expectedName) fail('main component is ' + JSON.stringify(name) + ', expected ' + JSON.stringify(expectedName));
          const bare = (v) => String(v).replace(/^v/, '');
          if (!expectedVersion) fail('no expected version given');
          if (main.version === undefined || main.version === '') main.version = bare(expectedVersion);
          else if (bare(main.version) !== bare(expectedVersion)) fail('version is ' + main.version + ', expected ' + expectedVersion);
          if (bom.components !== undefined && !Array.isArray(bom.components)) fail('components is not an array');
          fs.writeFileSync(file, JSON.stringify(bom, null, 2) + '\n');
          console.log('SBOM ok: ' + name + '@' + main.version + ', ' + (bom.components || []).length + ' components');
          JS

      - name: Publish to PyPI (Trusted Publishing + attestations)
        if: steps.manifest.outputs.publish_registry == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

      - name: Attest build provenance for GitHub Release assets
        # Free-tier orgs can only attest in PUBLIC repos. Auto-enables on flip.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # The SBOM too (it lives outside dist/), so a replaced Release asset
          # is detectable.
          subject-path: |
            dist/*
            sbom/*.cdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* "$SBOM_FILE" \
            --title "chronary ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt
